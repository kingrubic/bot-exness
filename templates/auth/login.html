<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="generator" content="Exness Bot 2026"/>
    <meta name="description" content="Đăng nhập hệ thống Exness Bot"/>
    <title>Đăng nhập | Exness Bot AI Platform</title>
    <meta name="robots" content="noindex,nofollow"/>
    <meta property="og:type" content="website"/>
    <meta property="og:title" content="Đăng nhập | Exness Bot AI Platform"/>
    <meta property="og:description" content="Đăng nhập hệ thống Exness Bot"/>
    <meta name="theme-color" content="#4272d7"/>
    <link href="/static/cooladmin/css/font-face.css" rel="stylesheet" media="all"/>
    <link rel="preconnect" href="https://rsms.me/"/>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css"/>
    <link href="/static/cooladmin/vendor/fontawesome-7.3.1/css/all.min.css" rel="stylesheet" media="all"/>
    <link href="/static/cooladmin/vendor/bootstrap-5.3.8.min.css" rel="stylesheet" media="all"/>
    <link href="/static/cooladmin/vendor/css-hamburgers/hamburgers.min.css" rel="stylesheet" media="all"/>
    <link href="/static/cooladmin/css/theme.css" rel="stylesheet" media="all"/>
    <link href="/static/cooladmin/css/app.css" rel="stylesheet" media="all"/>
  </head>
  <body class="app auth-page"><a class="visually-hidden-focusable skip-link" href="#auth-form">Skip to sign-in form</a>
    <main class="login-wrap" id="auth-form">
      <div class="login-content">
            <a href="/" class="auth-brand" aria-label="Exness Bot home">
                <span class="logo-mark" aria-hidden="true">E</span>
                <span class="logo-text">Exness Bot</span>
            </a>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Sign in to continue to your dashboard.</p>

            {% if error %}
            <div class="alert alert-danger py-2 px-3 mb-3 text-center" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <form class="login-form" action="{% url 'login_view' %}" method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" class="au-input" type="text" name="username"
                        placeholder="Username" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" class="au-input" type="password" name="password"
                        placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <div class="login-checkbox">
                    <label>
                        <input type="checkbox" name="remember" checked>
                        Remember me
                    </label>
                    <a href="/">Back to Home</a>
                </div>
                <button class="au-btn au-btn--green" type="submit">Sign in</button>
            </form>
      </div>
    </main>
    <script src="/static/cooladmin/js/vanilla-utils.js"></script>
    <script src="/static/cooladmin/vendor/bootstrap-5.3.8.bundle.min.js"></script>
    <script src="/static/cooladmin/js/bootstrap5-init.js"></script>
    <script src="/static/cooladmin/js/main-vanilla.js"></script>
    <script src="/static/cooladmin/js/modern-plugins.js"></script>
  </body>
</html>
