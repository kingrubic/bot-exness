# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION CHO EXNESS AUTO TRADE PLATFORM
# Lưu file này tại: /etc/nginx/sites-available/exness_bot
# Kích hoạt: sudo ln -s /etc/nginx/sites-available/exness_bot /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Static files caching
    location /static/ {
        alias /home/ubuntu/Documents/resource/github-user/exness/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Proxy traffic to Django App running on port 8000
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
